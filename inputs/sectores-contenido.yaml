# ==========================================================================
# CONTENIDO POR SECTOR — RankeaLocal
# ==========================================================================
# Fuente única del contenido de cada página de oficio. Editable a mano y
# pensado para que la IA constructora monte las páginas desde aquí.
#
# ESQUEMA de cada sector:
#   slug:        identificador para la URL (sin tildes ni espacios)
#   oficio:      nombre del oficio (como en el directorio)
#   categoria:   categoría del directorio
#   hero:
#     eyebrow / h1 / p        -> textos del hero (h1 lleva "... Y quédatelo.")
#   datos:                    -> las 3 fichas bajo el hero
#     mas_buscado / mejor_ticket / mas_margen
#   se_busca:                 -> "Lo que se busca en [oficio]" (svc-grid)
#     lista de términos/servicios que busca la gente
#   mejor_pagado:             -> gráfico "Lo que mejor se paga" (6 servicios)
#     - servicio / ticket (€ por trabajo)
#   mercado:                  -> "El mercado, servicio a servicio" (12 servicios)
#     - servicio / tag / busquedas (al mes) / ticket (€)
#   frentes:                  -> "Qué trabajamos en [oficio]" (6 párrafos)
#     ficha / web / resenas / contenido / ia / medicion
#   perfiles:                 -> "Cómo busca tu cliente" (2-3 perfiles)
#     - nombre / texto
#
# NOTA: búsquedas y tickets son CIFRAS DE EJEMPLO plausibles, pendientes de
# keyword research real antes de publicar.
# ==========================================================================

sectores:

