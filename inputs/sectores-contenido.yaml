      - { servicio: "Urgencias 24 h",          tag: "Urgencia",    busquedas: 5200, ticket: 160 }
      - { servicio: "Desatascos",              tag: "Urgencia",    busquedas: 4800, ticket: 150 }
      - { servicio: "Reparación de caldera",   tag: "Avería",      busquedas: 3900, ticket: 180 }
      - { servicio: "Reforma de baño",         tag: "Reforma",     busquedas: 3200, ticket: 3500 }
      - { servicio: "Instalación de caldera",  tag: "Instalación", busquedas: 2400, ticket: 1200 }
      - { servicio: "Calentadores",            tag: "Instalación", busquedas: 2100, ticket: 450 }
      - { servicio: "Grifería y sanitarios",   tag: "Avería",      busquedas: 1700, ticket: 130 }
      - { servicio: "Cambio de tuberías",      tag: "Reforma",     busquedas: 1400, ticket: 900 }
      - { servicio: "Termos eléctricos",       tag: "Instalación", busquedas: 1300, ticket: 350 }
      - { servicio: "Detección de fugas",      tag: "Avería",      busquedas: 1100, ticket: 200 }
      - { servicio: "Mantenimiento",           tag: "Preventivo",  busquedas: 900,  ticket: 90 }
    frentes:
      ficha: "Tu ficha de Google es lo primero que ve quien busca un fontanero, y casi nadie pasa de los tres primeros del mapa. Trabajamos la categoría, tu zona real de servicio, horarios, urgencias 24 h, fotos de trabajos y la coherencia de tus datos para que Google te ponga por delante de las fichas a medias."
      web: "Una web bonita que no genera llamadas no sirve. La tuya tiene un objetivo: que quien entra coja el teléfono. Botón de llamar siempre visible, tus servicios explicados como los busca la gente, fotos reales, zona de urgencias clara y carga rápida en móvil, que es desde donde te buscan el 80% de las veces."
      resenas: "Las reseñas, después del mapa, son lo que más decide. Montamos un sistema para pedírselas al cliente recién terminado el trabajo, sin que persigas a nadie, y las respondemos todas. Con el tiempo construyes una reputación que te separa del fontanero sin reseñas de al lado."
      contenido: "Nadie busca solo 'fontanero'. Buscan 'fontanero urgente en [tu barrio]', 'reparar caldera en [tu ciudad]', 'desatascos 24 h cerca'. Creamos páginas por servicio y por zona para que aparezcas en todas esas búsquedas concretas, no solo en una."
      ia: "Cada vez más gente le pregunta a ChatGPT o al asistente del móvil '¿qué fontanero me recomiendas cerca?'. Esas respuestas se construyen con las mismas señales que cuidamos, trabajadas para que la IA también te encuentre. Adelantarse hoy es aparecer mañana donde la competencia aún no está."
      medicion: "De nada sirve todo esto si no sabes qué funciona. Medimos lo único que importa: cuántas llamadas entran de verdad desde tu ficha y tu web, de qué servicios y desde qué zonas. Cada mes te enseñamos los números reales y qué hemos hecho para moverlos."
    perfiles:
      - nombre: "La urgencia"
        texto: "Una fuga a las 23 h no compara: llama al primero que sale en el mapa. Hay que estar arriba justo en ese momento, con el botón de llamar a un toque."
      - nombre: "La reforma"
        texto: "Quien va a reformar el baño sí se lo piensa: mira fotos de trabajos, precios y reseñas antes de decidir. Hay que convencerle ahí, no solo aparecer."

